name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this job only reads the checkout. Without this the token
# gets the repository default, which can be read/write on push events.
permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      # Pinned by commit SHA, not by tag: a tag is mutable, so a compromised or
      # retargeted tag would run new code here with the workflow's token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # From requirements.txt, deliberately. A hand-written package list
          # drifted from what actually runs: the passphrase tests import
          # `ponishabot.auth`, which does `from selenium import webdriver` at
          # module level, so every job failed on a missing selenium that the
          # application itself installs. Testing against the real dependency set
          # is the point; a curated subset only ever proves the subset works.
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Unit tests
        run: python -m unittest discover -s tests -v
